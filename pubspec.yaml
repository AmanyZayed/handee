name: handee
description: HANDEE Flutter Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2

  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5   
  camera: ^0.10.5+9
  tflite_flutter: 0.10.4 
  google_mlkit_pose_detection: ^0.11.0
  google_mlkit_face_detection: ^0.11.0
  video_player: ^2.11.1
  speech_to_text: ^6.6.2
  flutter_tts: ^4.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/model/model.tflite
    - assets/model/sign_to_prediction_index_map.json
    - assets/asl/
    - assets/signs/
    - assets/signs_cropped/